name: Umbra CI

on:
  push:
    branches: [main]
    paths:
      - 'Umbra/**'
      - 'Packages/**'
      - 'Sources/Penumbra/**'
      - 'Sources/EditorIntelligence/**'
      - 'Sources/JavaIntelligence/**'
      - 'Package.swift'
      - '.github/workflows/editor-ci.yml'
      - '.github/actions/**'
      - 'Scripts/check-ios-carryover.sh'
      - 'Scripts/check-design-tokens.sh'
      - 'Scripts/ci-*.sh'
      - 'Scripts/refuse-paid-test-variables.sh'
  pull_request:
    paths:
      - 'Umbra/**'
      - 'Packages/**'
      - 'Sources/Penumbra/**'
      - 'Sources/EditorIntelligence/**'
      - 'Sources/JavaIntelligence/**'
      - 'Package.swift'
      - '.github/workflows/editor-ci.yml'
      - '.github/actions/**'
      - 'Scripts/check-ios-carryover.sh'
      - 'Scripts/check-design-tokens.sh'
      - 'Scripts/ci-*.sh'
      - 'Scripts/refuse-paid-test-variables.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umbra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editor:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/xcode27-setup

      - name: Check for legacy iOS carryover
        run: bash Scripts/check-ios-carryover.sh

      # Spacing, glyph sizes and padding in Umbra's core chrome come from IDEAppearance tokens.
      - name: Check design tokens in Umbra chrome
        run: bash Scripts/check-design-tokens.sh

      # The library package must build on its own (macOS 14, no app dependencies), so an Umbra-only
      # import cannot leak into Penumbra or the intelligence libraries.
      - name: Build the libraries
        run: swift build --build-tests

      # Java completion goldens plus the engine path the editor takes. Fails when no JDK is present
      # (a skipped corpus would pass while testing nothing).
      - name: Java completion tests
        run: bash Scripts/ci-java-tests.sh

      - name: Build Umbra
        run: swift build --package-path Umbra -c release --product Umbra

  # AgentKit's own suite. Its paid-API tests are opt-in by variable and refuse to run when CI is set;
  # the setup action also fails the job if a key variable is present.
  agentkit-tests:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CI: '1'
      NSUnbufferedIO: 'YES'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/xcode27-setup
        with:
          metal: 'false'

      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Packages/AgentKit/.build/repositories
          key: spm-agentkit-${{ runner.os }}-${{ hashFiles('Packages/AgentKit/Package.resolved') }}
          restore-keys: spm-agentkit-${{ runner.os }}-

      - name: Build AgentKit tests
        run: swift build --package-path Packages/AgentKit --build-tests

      # Dependencies are resolved and built; from here a call to an AI or npm host fails.
      - name: Block AI and npm hosts
        run: Scripts/ci-network-guard.sh

      - name: AgentKit tests
        run: swift test --package-path Packages/AgentKit --skip-build --parallel

  # Every Umbra unit test except the opt-in live-agent suite, plus a check that the deterministic ACP
  # suites ran without a skip. Fixtures write only to temporary directories; the guards prove it.
  umbra-tests:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CI: '1'
      NSUnbufferedIO: 'YES'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/xcode27-setup

      # The ACP install tests start the fixture agent with a real Node process.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Umbra/.build/repositories
          key: spm-umbra-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Umbra/Package.resolved', 'Packages/*/Package.resolved') }}
          restore-keys: spm-umbra-${{ runner.os }}-

      - name: Cache JaCoCo downloads
        uses: actions/cache@v4
        with:
          path: Umbra/Sources/Umbra/Tools/JaCoCo
          key: jacoco-${{ hashFiles('Umbra/Sources/Umbra/Tools/JaCoCo/fetch.sh') }}

      - name: Build Umbra tests
        run: swift build --package-path Umbra --build-tests

      - name: Snapshot user state
        run: Scripts/ci-user-state-guard.sh snapshot

      - name: Start agent tripwire
        run: Scripts/ci-agent-tripwire.sh start

      - name: Block AI and npm hosts
        run: Scripts/ci-network-guard.sh

      - name: Umbra tests
        run: Scripts/ci-umbra-tests.sh

      - name: Verify no real agent or npm ran
        if: always()
        run: Scripts/ci-agent-tripwire.sh verify

      - name: Verify user state unchanged
        if: always()
        run: Scripts/ci-user-state-guard.sh verify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: umbra-test-results
          path: ${{ runner.temp }}/results
          retention-days: 14
          if-no-files-found: ignore

  # The 19 ACP Adapter Manager XCUITests. Everything they use is a fixture: captured registry documents,
  # a fake npm, a Node script standing in for the agent, temporary adapter/session/defaults locations.
  # Hosted runners are not guaranteed a GUI session or an Accessibility grant, so the job checks first and
  # then runs the suite anyway; a runner that cannot drive the GUI fails the job with the blocker named.
  # It never skips and never reports success without 19 passing tests. See docs/CI.md.
  acp-ui-tests:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CI: '1'
      NSUnbufferedIO: 'YES'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/xcode27-setup

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The UI harness only looks in these three places and skips its Node tests when it finds none.
      - name: Make Node visible to the UI harness
        run: |
          set -euo pipefail
          for candidate in /opt/homebrew/bin/node /usr/local/bin/node /usr/bin/node; do
            if [ -x "$candidate" ]; then echo "node already at $candidate"; exit 0; fi
          done
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          /usr/local/bin/node --version

      - name: Cache cloned Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Umbra/Umbra.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Umbra/Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      - name: Cache JaCoCo downloads
        uses: actions/cache@v4
        with:
          path: Umbra/Sources/Umbra/Tools/JaCoCo
          key: jacoco-${{ hashFiles('Umbra/Sources/Umbra/Tools/JaCoCo/fetch.sh') }}

      # Resolves packages and runs the JaCoCo fetch phase while the network is still open.
      - name: Build UI tests
        run: Scripts/ci-acp-ui-tests.sh --build-only

      - name: Keep the display awake
        run: |
          nohup caffeinate -u -d -i -s >/dev/null 2>&1 &

      - name: GUI preflight
        run: Scripts/ci-gui-preflight.sh

      - name: Snapshot user state
        run: Scripts/ci-user-state-guard.sh snapshot

      - name: Start agent tripwire
        run: Scripts/ci-agent-tripwire.sh start

      - name: Block AI and npm hosts
        run: Scripts/ci-network-guard.sh

      - name: ACP XCUITests
        run: Scripts/ci-acp-ui-tests.sh --no-build

      - name: Verify no real agent or npm ran
        if: always()
        run: Scripts/ci-agent-tripwire.sh verify

      - name: Verify user state unchanged
        if: always()
        run: Scripts/ci-user-state-guard.sh verify

      - name: Upload xcresult bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acp-ui-xcresult
          path: |
            ${{ runner.temp }}/results/*.xcresult
            ${{ runner.temp }}/results/*.log
          retention-days: 14
          if-no-files-found: warn
