name: Umbra CI

on:
  push:
    branches: [main]
    paths:
      - 'Example/**'
      - 'Sources/Penumbra/**'
      - 'Sources/EditorIntelligence/**'
      - 'Package.swift'
      - '.github/workflows/editor-ci.yml'
  pull_request:
    paths:
      - 'Example/**'
      - 'Sources/Penumbra/**'
      - 'Sources/EditorIntelligence/**'
      - 'Package.swift'
      - '.github/workflows/editor-ci.yml'

concurrency:
  group: umbra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editor:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build Umbra
        run: swift build -c release --product Umbra
