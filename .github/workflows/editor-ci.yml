name: Umbra CI

on:
  push:
    branches: [main]
    paths:
      - 'Umbra/**'
      - 'Sources/Penumbra/**'
      - 'Sources/EditorIntelligence/**'
      - 'Sources/JavaIntelligence/**'
      - 'Package.swift'
      - '.github/workflows/editor-ci.yml'
      - 'Scripts/check-ios-carryover.sh'
  pull_request:
    paths:
      - 'Umbra/**'
      - 'Sources/Penumbra/**'
      - 'Sources/EditorIntelligence/**'
      - 'Sources/JavaIntelligence/**'
      - 'Package.swift'
      - '.github/workflows/editor-ci.yml'
      - 'Scripts/check-ios-carryover.sh'

concurrency:
  group: umbra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editor:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      # Tests that call OpenAI, Anthropic or an Ollama server (Packages/AgentKit: the smoke tests and the
      # evals) are opt-in by environment variable and cost money. They also refuse to run when CI is set,
      # but a workflow must not hand them a key at all, so fail if one ever does.
      - name: Refuse variables that enable paid-API tests
        run: Scripts/refuse-paid-test-variables.sh

      # Xcode 27's default metal is a stub. Unless the separate Metal toolchain is
      # mounted, Swift Build calls that stub, it exits before writing a .dia, and
      # the log only shows a missing diagnostics file for the first shader
      # (MLX steel_attention.metal, or SwiftTerm's Shaders.metal before that).
      - name: Install Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -showComponent MetalToolchain
          metal="$(xcrun -f metal)"
          echo "metal: ${metal}"
          case "${metal}" in
            *XcodeDefault.xctoolchain*)
              echo "error: xcrun metal is the Xcode stub; the Metal toolchain is not mounted" >&2
              exit 1
              ;;
          esac
          "${metal}" --version

      - name: Check for legacy iOS carryover
        run: bash Scripts/check-ios-carryover.sh

      # The library package must build on its own (macOS 14, no app dependencies), so an Umbra-only
      # import cannot leak into Penumbra or the intelligence libraries.
      - name: Build the libraries
        run: swift build --build-tests

      - name: Build Umbra
        run: swift build --package-path Umbra -c release --product Umbra
