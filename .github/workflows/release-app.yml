name: Release Umbra

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

# A newer push to main supersedes an in-flight nightly; version tags always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # build-app.sh notarizes only when the APPLE_* variables are set, so nightlies
      # (pushes to main) are signed but not notarized; version tags are both.
      - name: Build, sign, and notarize
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_ID || '' }}
          APPLE_NOTARIZATION_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_NOTARIZATION_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          chmod +x Scripts/build-app.sh
          ./Scripts/build-app.sh

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "Umbra $VERSION" \
            --notes "macOS editor release. Download \`Umbra-${VERSION}-macOS.zip\`, unzip, and open Umbra.app." \
            "dist/Umbra-${VERSION}-macOS.zip"

      - name: Publish nightly
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          NIGHTLY_ZIP="dist/Umbra-nightly-${SHORT_SHA}-macOS.zip"
          cp "dist/Umbra-${VERSION}-macOS.zip" "$NIGHTLY_ZIP"
          # One rolling `nightly` prerelease: replace the previous one and move its tag to this commit.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Umbra Nightly (${SHORT_SHA})" \
            --notes "Unreleased build of \`main\` at ${GITHUB_SHA} (based on ${VERSION}). Download \`$(basename "$NIGHTLY_ZIP")\` and unzip it. Nightlies are signed but not notarized: if macOS blocks the first launch, allow it under System Settings › Privacy & Security › Open Anyway (or run \`xattr -dr com.apple.quarantine Umbra.app\`)." \
            "$NIGHTLY_ZIP"
