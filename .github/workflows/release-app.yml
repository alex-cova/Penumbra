name: Release Umbra

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  actions: write

# A newer push to main supersedes an in-flight nightly; version tags always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Hand-made tags once shipped Umbra-1.6.8-macOS.zip as 1.6.9/1.6.10, which generate_appcast then
      # treated as a duplicate version. A release tag must match VERSION.
      - name: Verify VERSION matches tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION ($VERSION); bump VERSION (Scripts/push-version.sh) and retag" >&2
            exit 1
          fi

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # build-app.sh notarizes only when the APPLE_* variables are set, so nightlies
      # (pushes to main) are signed but not notarized; version tags are both.
      - name: Build, sign, and notarize
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_ID || '' }}
          APPLE_NOTARIZATION_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_NOTARIZATION_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          chmod +x Scripts/build-app.sh
          ./Scripts/build-app.sh

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "Umbra $VERSION" \
            --notes "macOS editor release. Download \`Umbra-${VERSION}-macOS.zip\`, unzip, and open Umbra.app." \
            "dist/Umbra-${VERSION}-macOS.zip"

      - name: Update Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"
          SCRATCH="$RUNNER_TEMP/umbra-updates"
          mkdir -p "$SCRATCH" website/updates

          # Sparkle only needs the latest release. generate_appcast applies --download-url-prefix to every
          # item it sees, so carrying older zips or the old appcast would rewrite their URLs to this tag.
          cp "dist/Umbra-${VERSION}-macOS.zip" "$SCRATCH/"

          GENERATE_APPCAST="$(find .build/artifacts/sparkle/Sparkle/bin -name generate_appcast -print -quit)"
          if [[ -z "$GENERATE_APPCAST" ]]; then
            echo "error: generate_appcast not found after build" >&2
            exit 1
          fi
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            echo "error: SPARKLE_ED_PRIVATE_KEY secret is not configured" >&2
            exit 1
          fi
          ED_KEY="$RUNNER_TEMP/sparkle-ed.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$ED_KEY"
          chmod 600 "$ED_KEY"

          "$GENERATE_APPCAST" \
            --ed-key-file "$ED_KEY" \
            --download-url-prefix "https://github.com/alex-cova/Penumbra/releases/download/${TAG}/" \
            --link "https://alex-cova.github.io/Penumbra/appcast.xml" \
            "$SCRATCH"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          cp "$SCRATCH/appcast.xml" website/appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/appcast.xml website/updates/
          if git diff --staged --quiet; then
            echo "No appcast changes to commit."
            exit 0
          fi
          git commit -m "Update Sparkle appcast for ${TAG}."
          git push origin main

          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy Pages explicitly;
          # otherwise the published appcast never changes and Sparkle reports "newest version".
          gh workflow run pages.yml --ref main

      - name: Publish nightly
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          NIGHTLY_ZIP="dist/Umbra-nightly-${SHORT_SHA}-macOS.zip"
          cp "dist/Umbra-${VERSION}-macOS.zip" "$NIGHTLY_ZIP"
          # One rolling `nightly` prerelease: replace the previous one and move its tag to this commit.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Umbra Nightly (${SHORT_SHA})" \
            --notes "Unreleased build of \`main\` at ${GITHUB_SHA} (based on ${VERSION}). Download \`$(basename "$NIGHTLY_ZIP")\` and unzip it. Nightlies are signed but not notarized: if macOS blocks the first launch, allow it under System Settings › Privacy & Security › Open Anyway (or run \`xattr -dr com.apple.quarantine Umbra.app\`)." \
            "$NIGHTLY_ZIP"
